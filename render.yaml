# Blueprint do Render para o backend do IncluIA — https://render.com/docs/blueprint-spec
# Ao conectar este repositório no Render como "Blueprint", ele lê este arquivo e propõe o serviço
# abaixo automaticamente, pedindo só os valores marcados com "sync: false" (segredos).
services:
  - type: web
    name: incluia-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: o IP do cliente vem do X-Forwarded-For do proxy do Render, que é a única
    # entrada do serviço; sem isso, os limites por IP valeriam para todos juntos.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # Gestão Ativa (AD-02): segredos próprios, separados para o token e para os códigos de acesso.
      # Sem eles, ou sem provedor de e-mail (EMAIL_MODO), a Gestão Ativa responde 503 e o site
      # público segue no ar. Nunca definir AMBIENTE=dev aqui.
      - key: GESTAO_SEGREDO_TOKEN
        generateValue: true
      - key: GESTAO_SEGREDO_CODIGO
        generateValue: true
      # E-mail pela API do Brevo (o plano gratuito do Render bloqueia SMTP). EMAIL_REMETENTE é o
      # remetente verificado no Brevo.
      - key: EMAIL_MODO
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: GESTAO_DATABASE_URL
        sync: false
      - key: INCLUIA_CORS_ORIGINS
        value: https://inclu-ia.vercel.app,https://escola-sem-barreiras.vercel.app,http://localhost:3000
